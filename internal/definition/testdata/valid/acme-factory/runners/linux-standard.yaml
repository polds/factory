# yaml-language-server: $schema=http://localhost:8080/api/v1/factory-files/schemas/v1alpha1/runner.schema.json
description: Standard Linux runner for payments builds and tests
setupCommands:
  - corepack enable
  - pnpm install --frozen-lockfile
instanceShape:
  vcpus: 4            # powers of two on linux
  memoryGb: 8
platform:
  os: linux
  arch: x86_64
  linux:
    dockerImage: ghcr.io/acme/payments-ci:2026-10
    registryCredentialSecretName: GHCR_PULL
failureSessionRetentionMinutes: 30
