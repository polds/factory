# Source: factory/templates/render.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: factory-worker-standard-config
  namespace: factory
  labels:
    helm.sh/chart: factory-0.1.0
    app.kubernetes.io/name: factory
    app.kubernetes.io/instance: factory
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: factory
    app.kubernetes.io/component: worker
    factory.dev/pool: "standard"
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  config.yaml: |
    worker_id: "standard"
    cleanup: true
    max_concurrent_tasks: 8
    collect_task_logs: true
    backend:
      kubernetes:
        namespace: "factory-runs"
        image_pull_policy: "IfNotPresent"
        use_image_volumes: false
        unschedulable_timeout: "10m"
        default_image: "ubuntu:22.04"
        extra_annotations:
          example.com/keep: keep
          karpenter.sh/do-not-disrupt: "true"
        active_deadline_seconds: 28800
        ttl_seconds_after_finished: 86400
        workspace_size_limit: "20Gi"
        pod_template:
          containers:
          - name: task
            resources:
              limits:
                memory: 4Gi
              requests:
                cpu: "1"
                memory: 2Gi
          nodeSelector:
            factory.dev/pool: standard
          serviceAccountName: factory-task
