---
# Source: factory/templates/render.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: factory-worker-standard
  namespace: factory
  labels:
    helm.sh/chart: factory-0.1.0
    app.kubernetes.io/name: factory
    app.kubernetes.io/instance: factory
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: factory
    app.kubernetes.io/component: worker
    factory.dev/pool: "standard"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: factory
      app.kubernetes.io/instance: factory
      app.kubernetes.io/component: worker
      factory.dev/pool: "standard"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: factory
        app.kubernetes.io/instance: factory
        app.kubernetes.io/component: worker
        factory.dev/pool: "standard"
      annotations:
        checksum/config: 62382cee63c551dc6a42de1540a22f41363e0c23cf834b76ebfda56b93dfd505
    spec:
      terminationGracePeriodSeconds: 600
      serviceAccountName: factory-worker-standard
      automountServiceAccountToken: true
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oz-agent-worker
          image: "ghcr.io/acme/oz-agent-worker:test"
          imagePullPolicy: IfNotPresent
          args:
            - --config-file
            - /etc/oz-agent-worker/config.yaml
            - --backend
            - kubernetes
            - --log-level
            - "info"
            - --web-socket-url
            - "ws://factory-factoryd.factory.svc:8080/api/v1/selfhosted/worker/ws"
            - --server-root-url
            - "http://factory-factoryd.factory.svc:8080"
          env:
            - name: WARP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: factory-worker
                  key: FACTORY_API_KEY
            - name: OTEL_METRICS_EXPORTER
              value: "none"
          volumeMounts:
            - name: config
              mountPath: /etc/oz-agent-worker
              readOnly: true
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "kill -0 1"]
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config
          configMap:
            name: factory-worker-standard-config
---
