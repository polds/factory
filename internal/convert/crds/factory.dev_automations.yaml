---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: automations.factory.dev
spec:
  group: factory.dev
  names:
    kind: Automation
    listKind: AutomationList
    plural: automations
    singular: automation
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Automation is one automations/<name>/automation.md.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AutomationSpec is the desired automation.
            properties:
              agentRef:
                description: LocalRef names a resource in the same namespace (D12).
                properties:
                  name:
                    type: string
                required:
                - name
                type: object
              displayName:
                type: string
              enabled:
                type: boolean
              factoryRef:
                description: LocalRef names a resource in the same namespace (D12).
                properties:
                  name:
                    type: string
                required:
                - name
                type: object
              files:
                items:
                  description: |-
                    SourceFile is one definition-tree file.

                    Content is what factoryctl convert writes back. Inline credential values
                    are removed before Content is stored. secretRefs, credentialRef, and
                    secretName stay names.
                  properties:
                    content:
                      type: string
                    path:
                      type: string
                  required:
                  - content
                  - path
                  type: object
                type: array
              harness:
                description: HarnessSpec is an explicit harness. It is mutually exclusive
                  with model.
                properties:
                  auth:
                    description: HarnessAuthSpec names a harness credential. SecretName
                      is a name.
                    properties:
                      secretName:
                        type: string
                      source:
                        type: string
                    type: object
                  model:
                    type: string
                  type:
                    type: string
                type: object
              mcpServers:
                additionalProperties:
                  description: |-
                    MCPServerSpec is one MCP server. Header and env values are either a
                    secretKeyRef object or a {{SECRET_NAME}} string, never credential material.
                  properties:
                    args:
                      items:
                        type: string
                      type: array
                    command:
                      type: string
                    env:
                      x-kubernetes-preserve-unknown-fields: true
                    headers:
                      x-kubernetes-preserve-unknown-fields: true
                    url:
                      type: string
                  type: object
                type: object
              model:
                type: string
              pool:
                type: string
              prompt:
                type: string
              promptFrom:
                description: ConfigMapSource is the instructionsFrom / promptFrom
                  / rubricFrom shape.
                properties:
                  configMapKeyRef:
                    description: ConfigMapKeyRef selects a key in a ConfigMap.
                    properties:
                      key:
                        type: string
                      name:
                        type: string
                    required:
                    - key
                    - name
                    type: object
                required:
                - configMapKeyRef
                type: object
              requiredRepos:
                items:
                  description: RepositoryRef is a code-forge repository.
                  properties:
                    codeForge:
                      type: string
                    deferred:
                      type: boolean
                    name:
                      type: string
                    owner:
                      type: string
                  type: object
                type: array
              runner:
                type: string
              secretRefs:
                items:
                  description: |-
                    SecretRef names a secret. Name is the secret's name. As is the env var
                    that name is exposed as. Neither field holds secret material.
                  properties:
                    as:
                      type: string
                    name:
                      type: string
                  required:
                  - name
                  type: object
                type: array
              secrets:
                items:
                  type: string
                type: array
              triggers:
                items:
                  description: TriggerSpec is one automation trigger. Filter keeps
                    the definition's shape.
                  properties:
                    event:
                      type: string
                    filter:
                      x-kubernetes-preserve-unknown-fields: true
                    provider:
                      type: string
                    schedule:
                      description: ScheduleSpec is a cron trigger.
                      properties:
                        cron:
                          type: string
                        name:
                          type: string
                      type: object
                  type: object
                type: array
            required:
            - enabled
            type: object
          status:
            description: AutomationStatus is reserved for the operator.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
