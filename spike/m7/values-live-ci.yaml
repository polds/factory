# live-ci uses the same chart shape as live. The workflow passes this file.
global:
  image:
    registry: ""
    pullPolicy: IfNotPresent
    tag: dev
  imagePullSecrets: []

controlPlane:
  replicas: 1
  image:
    repository: factoryd
  externalUrl: ""
  taskServerURL: ""
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  ingress:
    enabled: false
  api:
    create: true
    apiKey: ""
    workerKey: ""
  extraEnv:
    - name: FACTORY_GITHUB_TOKEN_MODE
      value: app
    - name: FACTORY_GITHUB_APP_PRIVATE_KEY_FILE
      value: /var/run/github-app/key.pem
  extraEnvFrom:
    - secretRef:
        name: m7-runtime
  extraVolumes:
    - name: github-app
      secret:
        secretName: m7-github-app
  extraVolumeMounts:
    - name: github-app
      mountPath: /var/run/github-app
      readOnly: true
  definition:
    files:
      factory.yaml: |
        schemaVersion: v1alpha1
        name: dev
        description: Unused in operator mode. The operator publishes the definition.

postgresql:
  enabled: true

minio:
  enabled: true

worker:
  image:
    repository: factory-upstream-worker

workers:
  - name: standard
    enabled: true
    backend: kubernetes
    replicas: 1
    workerId: k8s-standard
    pool: standard
    maxConcurrentTasks: 2
    logLevel: info
    cleanup: true
    terminationGracePeriodSeconds: 600
    apiKeySecret:
      name: factory-worker
      key: FACTORY_API_KEY
      create: false
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
    nodeSelector: {}
    tolerations: []
    affinity: {}
    metrics:
      enabled: true
      exporter: prometheus
      port: 9464
    kubernetesBackend:
      namespace: factory-runs
      defaultImage: ubuntu:22.04
      imagePullPolicy: IfNotPresent
      useImageVolumes: false
      preflightImage: busybox:1.36
      activeDeadlineSeconds: 28800
      ttlSecondsAfterFinished: 86400
      workspaceSizeLimit: 1Gi
      unschedulableTimeout: 10m
      extraAnnotations:
        karpenter.sh/do-not-disrupt: "true"
      extraLabels: {}
      podTemplate: {}
      preflightResources: {}
