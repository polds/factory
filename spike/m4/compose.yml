# spike/m4 overlay. Merged with deploy/docker-compose.yml.
# Profile m4 (fake-github, fake-slack) and profile tunnel stay in the base
# file. This overlay only publishes M4 settings into factoryd.
services:
  factoryd:
    environment:
      FACTORY_GITHUB_APP_ID: ${FACTORY_GITHUB_APP_ID:-}
      FACTORY_GITHUB_APP_PRIVATE_KEY_FILE: /run/secrets/github-app.pem
      FACTORY_GITHUB_WEBHOOK_SECRET: ${FACTORY_GITHUB_WEBHOOK_SECRET:-}
      FACTORY_GITHUB_TOKEN_MODE: ${FACTORY_GITHUB_TOKEN_MODE:-}
      FACTORY_GITHUB_API_BASE: ${FACTORY_GITHUB_API_BASE:-}
      FACTORY_SLACK_BOT_TOKEN: ${FACTORY_SLACK_BOT_TOKEN:-}
      FACTORY_SLACK_SIGNING_SECRET: ${FACTORY_SLACK_SIGNING_SECRET:-}
      FACTORY_SLACK_TEAM_ID: ${FACTORY_SLACK_TEAM_ID:-}
      FACTORY_SLACK_API_BASE: ${FACTORY_SLACK_API_BASE:-}
      FACTORY_LINEAR_API_KEY: ${FACTORY_LINEAR_API_KEY:-}
      FACTORY_LINEAR_WEBHOOK_SECRET: ${FACTORY_LINEAR_WEBHOOK_SECRET:-}
      FACTORY_LINEAR_API_BASE: ${FACTORY_LINEAR_API_BASE:-}
      FACTORY_DELIVERY_RETENTION: ${FACTORY_DELIVERY_RETENTION:-}
      FACTORY_SCHEDULE_CATCHUP: ${FACTORY_SCHEDULE_CATCHUP:-}
    volumes:
      - ${M4_GITHUB_APP_KEY_HOST:?set M4_GITHUB_APP_KEY_HOST}:/run/secrets/github-app.pem:ro
