# Manual M2 live run.
#
# One click (after filling the model id) starts the laptop profile and
# drives factoryctl run --watch through a real model. The agent clones
# the target repo, edits spike/m1/fixture, and opens a draft PR.
# This workflow is not part of the required CI check. Dispatch it from
# the orchestrator; do not run it on pull_request or push.
# exec so cancel SIGINT reaches the driver's EXIT/INT/TERM trap.
#
# permissions is contents:read only. GITHUB_TOKEN cannot push or open
# PRs. Live git and gh use the M1_GH_TOKEN secret.
#
# Repository secrets (values are masked; never printed by run.sh):
#   M1_OPENAI_BASE_URL   OpenAI-compatible endpoint (OPENAI_BASE_URL)
#   M1_OPENAI_API_KEY    optional; omit the secret to run without a key
#   M1_GH_TOKEN          fine-grained PAT, fixture repo only (GH_TOKEN)
name: m2-live

on:
  workflow_dispatch:
    inputs:
      model:
        description: Model id (M2_MODEL)
        required: true
        type: string
      repo:
        description: Repository the agent clones and opens a draft PR against (M2_REPO)
        required: false
        default: polds/factory
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  live:
    name: m2 live
    runs-on: ubuntu-latest
    # Image builds plus the agent run. The offline job's cap is 40 minutes;
    # live adds model time on top of the same builds.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run the live M2 driver
        env:
          OPENAI_BASE_URL: ${{ secrets.M1_OPENAI_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.M1_OPENAI_API_KEY }}
          GH_TOKEN: ${{ secrets.M1_GH_TOKEN }}
          M2_MODEL: ${{ inputs.model }}
          M2_REPO: ${{ inputs.repo }}
        run: MODE=live exec ./spike/m2/run.sh
      # .work is a hidden directory, so the upload must opt in.
      - name: Upload harness event archive
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: m2-harness-events
          path: spike/m2/.work/evidence/
          retention-days: 30
          include-hidden-files: true
          if-no-files-found: error
