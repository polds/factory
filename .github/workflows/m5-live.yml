# Manual M5 CI live run.
#
# workflow_dispatch only. This workflow is not part of the required CI
# check. Dispatch it from the orchestrator; do not run it on
# pull_request or push.
#
# permissions is contents:read only. GITHUB_TOKEN cannot push or open
# PRs. MODE=live-ci reads M1_OPENAI_BASE_URL and M1_OPENAI_API_KEY.
# A missing variable prints "missing <NAME>" and exits before any
# container starts. There is no skip path. M5_LIVE_MODEL is the
# dispatch input, not a secret. The default is the M1 live model
# claude-sonnet-5-5.
#
# Repository secrets (values are masked; never printed):
#   M1_OPENAI_BASE_URL   OpenAI-compatible endpoint
#   M1_OPENAI_API_KEY    key for that endpoint
name: m5-live

on:
  workflow_dispatch:
    inputs:
      model:
        description: Model id (M5_LIVE_MODEL). Default is the M1 live model.
        required: false
        default: claude-sonnet-5-5
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  live:
    name: m5 live
    runs-on: ubuntu-latest
    # Image builds plus the same day as offline, against a real model.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run the CI live M5 driver
        env:
          M1_OPENAI_BASE_URL: ${{ secrets.M1_OPENAI_BASE_URL }}
          M1_OPENAI_API_KEY: ${{ secrets.M1_OPENAI_API_KEY }}
          M5_LIVE_MODEL: ${{ inputs.model }}
        run: MODE=live-ci ./spike/m5/run.sh
      # .work is a hidden directory, so the upload must opt in.
      - name: Upload M5 evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: m5-evidence
          path: spike/m5/.work/evidence/
          retention-days: 30
          include-hidden-files: true
          if-no-files-found: error
