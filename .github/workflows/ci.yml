# Required CI.
#
# Branch protection should require the single check named `required`.
# That job fails unless every job below succeeded, including jobs for
# languages that are not in the tree yet (those pass until their files
# land, then fail closed).
#
# Mark these required by requiring `required`. Do not also require the
# individual job names unless you want a branch-protection edit every
# time a job is added.
#
#   go lint and format     golangci-lint (includes gofmt and goimports)
#   go build               go build -trimpath ./...
#   go test                go test -race -count=1 -cover -v ./...
#                          Postgres 16 and MinIO, so store/server/S3 tests run
#   go module              go mod verify, go mod tidy -diff
#   shell                  shfmt and shellcheck
#   yaml                   yamllint
#   docker                 hadolint
#   workflows              actionlint
#   vuln                   govulncheck
#   harness image          sidecar image smoke
#   worker image           unmodified oz-agent-worker, vcs.modified=false
#   m0 protocol spike      unmodified oz-agent-worker against the M0 server
#   m1 offline e2e         MODE=offline ./spike/m1/run.sh
#   m2 offline e2e         MODE=offline ./spike/m2/run.sh
#   m3 offline e2e         MODE=offline ./spike/m3/run.sh
#   m4 offline e2e         MODE=offline ./spike/m4/run.sh
#   m5 offline e2e         MODE=offline ./spike/m5/run.sh
#   m6 offline e2e         MODE=offline ./spike/m6/run.sh
#   task image platform    task and harness images built for linux/arm64
#   upcoming languages     TypeScript, Python, SQL, Helm, JSON Schema
#   console                web/console lint, typecheck, test, build, audit,
#                          and Go/TypeScript console golden parity
#   factory/config         validate definition trees; succeed without
#                          validating when those paths did not change
#
# Not required, and not workflows yet:
#   markdownlint           docs are prose; a default ruleset fights the house style
#   gosec / revive         see .golangci.yml
#   coverage threshold     no agreed bar
#   CodeQL                 turn on after code scanning is enabled for the repo
#   nightly model e2e      docs/12; there is no fixture and it needs a local model
#   action SHA review      pins are updated by Dependabot, not by a status check
# Manual, not part of `required`:
#   m1 live                .github/workflows/m1-live.yml (workflow_dispatch)
#   m2 live                .github/workflows/m2-live.yml (workflow_dispatch)
#   m3 live                .github/workflows/m3-live.yml (workflow_dispatch)
#   m4 live                .github/workflows/m4-live.yml (workflow_dispatch)
#   m5 live                .github/workflows/m5-live.yml (workflow_dispatch)
#   m6 live                .github/workflows/m6-live.yml (workflow_dispatch)
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  go-lint:
    name: go lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          args: --timeout=5m
          install-mode: binary

  go-build:
    name: go build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build every package
        run: go build -trimpath ./...
      - name: M2 run.sh unit tests
        run: M2_REQUIRE_GO=1 ./spike/m2/run_test.sh

  go-test:
    name: go test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Store and server tests skip without FACTORY_TEST_DATABASE_URL (that
    # left store coverage at 6.4%). The S3 round-trip skips without
    # FACTORY_TEST_S3_ENDPOINT. Services are healthy before steps run.
    # MinIO uses the image entrypoint and default command (no `server /data`).
    # MINIO_ROOT_USER is factoryadmin, at least 3 characters, and matches
    # FACTORY_TEST_S3_KEY. The client image creates the `factory` bucket;
    # a service cannot override that image's command without replacing
    # its entrypoint, and the default command exits.
    env:
      FACTORY_TEST_DATABASE_URL: "postgres://postgres:t@127.0.0.1:5432/factory?sslmode=disable"
      FACTORY_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      FACTORY_TEST_S3_KEY: factoryadmin
      FACTORY_TEST_S3_SECRET: factorysecret
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: t
          POSTGRES_DB: factory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d factory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      minio:
        image: "bitnamilegacy/minio:2025.7.23-debian-12-r5\
          @sha256:6dabb4a2088c9a79908de3bc05f4586c23ad2182c8908e7e3acbf61c1467fb20"
        env:
          MINIO_ROOT_USER: factoryadmin
          MINIO_ROOT_PASSWORD: factorysecret
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -fsS http://127.0.0.1:9000/minio/health/ready"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 10s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Create the MinIO test bucket
        run: |
          set -euo pipefail
          mc_image='bitnamilegacy/minio-client:2025.7.21-debian-12-r3'
          mc_image+='@sha256:73bd39f7899a0cef12b8dd5df13aa93a3ed1aaa44236542442e9ac76819ac158'
          docker run --rm --network host \
            -e HOME=/tmp \
            -e MINIO_ROOT_USER="${FACTORY_TEST_S3_KEY}" \
            -e MINIO_ROOT_PASSWORD="${FACTORY_TEST_S3_SECRET}" \
            "$mc_image" \
            /bin/bash -ec '
              set -euo pipefail
              mkdir -p /tmp/mc
              ok=0
              for _ in $(seq 1 30); do
                if mc --config-dir /tmp/mc alias set local http://127.0.0.1:9000 \
                  "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; then
                  ok=1
                  break
                fi
                sleep 2
              done
              if [[ "$ok" -ne 1 ]]; then
                echo "minio did not accept the test credentials" >&2
                exit 1
              fi
              mc --config-dir /tmp/mc mb --ignore-existing local/factory
              mc --config-dir /tmp/mc anonymous set none local/factory
            '
      - name: Test with the race detector
        run: go test -race -count=1 -cover -v ./...

  go-module:
    name: go module
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify and tidy the module
        run: |
          set -euo pipefail
          go mod verify
          go mod tidy -diff

  shell:
    name: shell
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install shellcheck and shfmt
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.local/bin"
          curl -fsSL -o /tmp/shellcheck.tar.xz \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          tar -C /tmp -xJf /tmp/shellcheck.tar.xz
          install -m 0755 /tmp/shellcheck-v0.11.0/shellcheck "${HOME}/.local/bin/shellcheck"
          curl -fsSL -o "${HOME}/.local/bin/shfmt" \
            https://github.com/mvdan/sh/releases/download/v3.14.1/shfmt_v3.14.1_linux_amd64
          chmod 0755 "${HOME}/.local/bin/shfmt"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      - name: Format and lint shell scripts
        run: |
          set -euo pipefail
          files=()
          while IFS= read -r -d '' file; do
            files+=("${file}")
          done < <(find . \( -path './.git' -o -path '*/.work' \) -prune -o -name '*.sh' -print0)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "no shell scripts found"
            exit 1
          fi
          # Printer flags override .editorconfig, so indent lives there.
          shfmt -d "${files[@]}"
          shellcheck -x "${files[@]}"
      - name: Upstream worker pin
        run: ./spike/lib/upstream_worker_test.sh
      - name: M2 run.sh unit tests
        run: ./spike/m2/run_test.sh
      - name: M4 run.sh unit tests
        run: ./spike/m4/run_test.sh
      - name: M3 run.sh unit tests
        run: ./spike/m3/run_test.sh
      - name: M5 run.sh unit tests
        run: ./spike/m5/run_test.sh

  yaml:
    name: yaml
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint YAML
        run: |
          set -euo pipefail
          python3 -m pip install --user 'yamllint==1.38.0'
          python3 -m yamllint -f github .

  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint Dockerfiles
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.local/bin"
          curl -fsSL -o /tmp/hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.14.0/hadolint-Linux-x86_64
          install -m 0755 /tmp/hadolint "${HOME}/.local/bin/hadolint"
          files=()
          while IFS= read -r -d '' file; do
            files+=("${file}")
          done < <(find . \( -path './.git' -o -path '*/.work' \) -prune -o -name 'Dockerfile' -print0)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "no Dockerfiles found"
            exit 1
          fi
          "${HOME}/.local/bin/hadolint" "${files[@]}"

  actions:
    name: workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint workflows
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.local/bin"
          curl -fsSL -o /tmp/shellcheck.tar.xz \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          tar -C /tmp -xJf /tmp/shellcheck.tar.xz
          install -m 0755 /tmp/shellcheck-v0.11.0/shellcheck "${HOME}/.local/bin/shellcheck"
          curl -fsSL -o /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          tar -C "${HOME}/.local/bin" -xzf /tmp/actionlint.tar.gz actionlint
          export PATH="${HOME}/.local/bin:${PATH}"
          actionlint -color

  vuln:
    name: vuln
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

  harness-image:
    name: harness image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build the sidecar and run one invocation
        run: ./harness/generic-openai/smoke.sh

  worker-image:
    name: worker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build the unmodified worker and check vcs.modified=false
        run: ./deploy/worker/smoke.sh

  protocol-spike:
    name: m0 protocol spike
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run an unmodified worker against the M0 server
        run: ./spike/m0/run.sh

  m1-offline:
    name: m1 offline e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run the offline M1 driver
        run: MODE=offline ./spike/m1/run.sh

  m2-offline:
    name: m2 offline e2e
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run the offline M2 driver
        run: MODE=offline ./spike/m2/run.sh

  m3-offline:
    name: m3 offline e2e
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run the offline M3 driver
        run: MODE=offline ./spike/m3/run.sh
      # .work is a hidden directory, so the upload must opt in.
      - name: Upload M3 evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: m3-offline-evidence
          path: spike/m3/.work/evidence/
          retention-days: 30
          include-hidden-files: true
          if-no-files-found: error

  m4-offline:
    name: m4 offline e2e
    runs-on: ubuntu-latest
    # Image builds plus the offline driver. That driver waits up to 15
    # minutes for handoff and 10 minutes for the Slack reply.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run the offline M4 driver
        run: MODE=offline ./spike/m4/run.sh

  m5-offline:
    name: m5 offline e2e
    runs-on: ubuntu-latest
    # Image builds plus the offline day. The offline copy sets the
    # implementer idleTimeoutMinutes to 1. Live and live-ci keep 5.
    # day.spec.ts still waits up to 8 minutes for the Done card.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: spike/m5/e2e/package-lock.json
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-m5-playwright-${{ hashFiles('spike/m5/e2e/package-lock.json') }}
      - name: Install Playwright browsers
        working-directory: spike/m5/e2e
        run: |
          set -euo pipefail
          npm ci
          npx playwright install chromium
      - name: Run the offline M5 driver
        run: MODE=offline ./spike/m5/run.sh
      # .work is a hidden directory, so the upload must opt in.
      # The Playwright trace lives under this evidence directory.
      - name: Upload M5 evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: m5-offline-evidence
          path: spike/m5/.work/evidence/
          retention-days: 30
          include-hidden-files: true
          if-no-files-found: warn

  m6-offline:
    name: m6 offline e2e
    runs-on: ubuntu-latest
    # No needs: this job runs in parallel with the other required jobs.
    # Playwright's test timeout is 25 minutes and waitForFile waits up
    # to 12 minutes (spike/m6/e2e). 30 minutes covers a cold image build
    # and the Playwright image pull on top of that.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run m6 no-network tests
        run: |
          set -euo pipefail
          start="${SECONDS}"
          set +e
          bash spike/m6/run_test.sh
          code=$?
          set -e
          printf 'spike/m6/run_test.sh %ss\n' "$((SECONDS - start))" | tee -a "${GITHUB_STEP_SUMMARY}"
          exit "${code}"
      # defaults.run.shell is bash -eo pipefail, so the driver's status
      # is the pipeline status. Playwright runs in the pinned image, so
      # this job has no setup-node and no npm or browser cache.
      - name: Run the offline M6 driver
        run: MODE=offline ./spike/m6/run.sh 2>&1 | tee "${RUNNER_TEMP}/m6-offline.log"
      - name: Record m6 phase times
        if: always()
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/m6-offline.log"
          {
            echo "## m6 phase times"
            echo
            echo "| Phase | Seconds |"
            echo "| --- | --- |"
          } >> "${GITHUB_STEP_SUMMARY}"
          found=0
          if [[ -f "${log}" ]]; then
            while IFS= read -r line || [[ -n "${line}" ]]; do
              if [[ "${line}" =~ ^m6\ phase\ (.+)\ ([0-9]+)s$ ]]; then
                printf '| %s | %s |\n' "${BASH_REMATCH[1]}" "${BASH_REMATCH[2]}" >> "${GITHUB_STEP_SUMMARY}"
                found=1
              fi
            done < "${log}"
          fi
          if [[ "${found}" -eq 0 ]]; then
            echo "no phase lines" >> "${GITHUB_STEP_SUMMARY}"
          fi
      # .work is a hidden directory, so the upload must opt in.
      # The Playwright trace lives under this evidence directory.
      - name: Upload M6 evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: m6-offline-evidence
          path: spike/m6/.work/evidence/
          retention-days: 30
          include-hidden-files: true
          if-no-files-found: warn

  task-image-arch:
    name: task image platform
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Enable arm64 emulation
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-user-static
      - name: Build the task and harness images for linux/arm64
        run: ./spike/m2/check-image-platform.sh linux/arm64

  upcoming-languages:
    name: upcoming languages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/console/package-lock.json
      - name: Lint TypeScript, Python, SQL, Helm, and JSON Schema when present
        run: ./scripts/ci/lint-upcoming.sh

  # The standalone factory-config workflow is path-filtered, so pulls
  # that do not touch a definition never report it. This job always
  # runs. It validates only when a definition path changed, and
  # otherwise succeeds so an unrelated pull does not fail `required`.
  # Path list matches .github/workflows/factory-config.yml.
  # deploy/<name>-factory matching is in scripts/ci/factory-config.sh.
  factory-config:
    name: factory/config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect definition path changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # 0 = config path, 1 = not. Any other status fails the step.
          # The script rejects deploy/*-factory/* because that glob
          # matches through / and would select nested trees.
          is_config_path() {
            local status=0
            scripts/ci/factory-config.sh --is-config-path "$1" || status=$?
            case "$status" in
              0) return 0 ;;
              1) return 1 ;;
              *)
                echo "factory/config: path check failed for ${1} (status ${status})" >&2
                exit 1
                ;;
            esac
          }

          changed=false
          case "$EVENT_NAME" in
            workflow_dispatch)
              changed=true
              ;;
            pull_request | push) ;;
            *)
              echo "factory/config: unexpected event ${EVENT_NAME}" >&2
              exit 1
              ;;
          esac

          if [[ "$changed" != true ]]; then
            {
              IFS= read -r mode
              IFS= read -r base
              IFS= read -r head
            } < <(python3 - "$EVENT_NAME" "$GITHUB_EVENT_PATH" <<'PY'
          import json
          import sys

          name, path = sys.argv[1], sys.argv[2]
          with open(path, encoding="utf-8") as handle:
              event = json.load(handle)
          if name == "pull_request":
              pull = event["pull_request"]
              print("three")
              print(pull["base"]["sha"])
              print(pull["head"]["sha"])
          elif name == "push":
              print("two")
              print(event["before"])
              print(event["after"])
          else:
              raise SystemExit("unexpected event %s" % name)
          PY
            )
            if [[ -z "${base}" || -z "${head}" || "${base}" == null || "${head}" == null ]]; then
              echo "factory/config: missing revision range for ${EVENT_NAME}" >&2
              exit 1
            fi
            if [[ "${base}" =~ ^0+$ ]]; then
              changed=true
            else
              if ! git cat-file -e "${base}^{commit}" 2>/dev/null ||
                ! git cat-file -e "${head}^{commit}" 2>/dev/null; then
                echo "factory/config: ${base}..${head} is not in the checkout" >&2
                exit 1
              fi
              echo "factory/config: comparing ${base}..${head} (${mode})"
              if [[ "$mode" == three ]]; then
                files="$(git diff --name-only "${base}...${head}")"
              elif [[ "$mode" == two ]]; then
                files="$(git diff --name-only "${base}" "${head}")"
              else
                echo "factory/config: bad diff mode ${mode}" >&2
                exit 1
              fi
              if [[ -n "$files" ]]; then
                while IFS= read -r file; do
                  if [[ -z "$file" ]]; then
                    continue
                  fi
                  if is_config_path "$file"; then
                    echo "factory config path: ${file}"
                    changed=true
                  fi
                done <<< "$files"
              fi
            fi
          fi

          if [[ "$changed" == true ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "factory/config will validate definition trees." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "factory/config skipped; no definition paths changed."
            echo "factory/config skipped; no definition paths changed." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.filter.outputs.changed == 'true'
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate factory definition trees
        if: steps.filter.outputs.changed == 'true'
        run: ./scripts/ci/factory-config.sh

  console:
    name: console
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/console/package-lock.json
      - name: Install, lint, test, and build the console
        working-directory: web/console
        run: |
          set -euo pipefail
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build
          npm audit --omit=dev --audit-level=high
      - name: Check Go and TypeScript console goldens
        run: ./scripts/ci/console-goldens.sh

  required:
    name: required
    needs:
      - go-lint
      - go-build
      - go-test
      - go-module
      - shell
      - yaml
      - docker
      - actions
      - vuln
      - harness-image
      - worker-image
      - protocol-spike
      - m1-offline
      - m2-offline
      - m3-offline
      - m4-offline
      - m5-offline
      - m6-offline
      - task-image-arch
      - upcoming-languages
      - console
      - factory-config
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every required job succeeded
        env:
          GO_LINT: ${{ needs.go-lint.result }}
          GO_BUILD: ${{ needs.go-build.result }}
          GO_TEST: ${{ needs.go-test.result }}
          GO_MODULE: ${{ needs.go-module.result }}
          SHELL_LINT: ${{ needs.shell.result }}
          YAML_LINT: ${{ needs.yaml.result }}
          DOCKER_LINT: ${{ needs.docker.result }}
          ACTIONS_LINT: ${{ needs.actions.result }}
          VULN: ${{ needs.vuln.result }}
          HARNESS_IMAGE: ${{ needs.harness-image.result }}
          WORKER_IMAGE: ${{ needs.worker-image.result }}
          PROTOCOL_SPIKE: ${{ needs.protocol-spike.result }}
          M1_OFFLINE: ${{ needs.m1-offline.result }}
          M2_OFFLINE: ${{ needs.m2-offline.result }}
          M3_OFFLINE: ${{ needs.m3-offline.result }}
          M4_OFFLINE: ${{ needs.m4-offline.result }}
          M5_OFFLINE: ${{ needs.m5-offline.result }}
          M6_OFFLINE: ${{ needs.m6-offline.result }}
          TASK_IMAGE_ARCH: ${{ needs.task-image-arch.result }}
          UPCOMING: ${{ needs.upcoming-languages.result }}
          CONSOLE: ${{ needs.console.result }}
          FACTORY_CONFIG: ${{ needs.factory-config.result }}
        run: |
          set -euo pipefail
          fail=0
          report() {
            printf '%-22s %s\n' "$1" "$2"
            if [[ "$2" != success ]]; then
              fail=1
            fi
            printf '| %s | %s |\n' "$1" "$2" >> "${GITHUB_STEP_SUMMARY}"
          }
          {
            echo "## Required checks"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
          } >> "${GITHUB_STEP_SUMMARY}"
          report "go lint and format" "${GO_LINT}"
          report "go build" "${GO_BUILD}"
          report "go test" "${GO_TEST}"
          report "go module" "${GO_MODULE}"
          report "shell" "${SHELL_LINT}"
          report "yaml" "${YAML_LINT}"
          report "docker" "${DOCKER_LINT}"
          report "workflows" "${ACTIONS_LINT}"
          report "vuln" "${VULN}"
          report "harness image" "${HARNESS_IMAGE}"
          report "worker image" "${WORKER_IMAGE}"
          report "m0 protocol spike" "${PROTOCOL_SPIKE}"
          report "m1 offline e2e" "${M1_OFFLINE}"
          report "m2 offline e2e" "${M2_OFFLINE}"
          report "m3 offline e2e" "${M3_OFFLINE}"
          report "m4 offline e2e" "${M4_OFFLINE}"
          report "m5 offline e2e" "${M5_OFFLINE}"
          report "m6 offline e2e" "${M6_OFFLINE}"
          report "task image platform" "${TASK_IMAGE_ARCH}"
          report "upcoming languages" "${UPCOMING}"
          report "console" "${CONSOLE}"
          report "factory/config" "${FACTORY_CONFIG}"
          exit "${fail}"
