# Required CI.
#
# Branch protection should require the single check named `required`.
# That job fails unless every job below succeeded, including jobs for
# languages that are not in the tree yet (those pass until their files
# land, then fail closed).
#
# Mark these required by requiring `required`. Do not also require the
# individual job names unless you want a branch-protection edit every
# time a job is added.
#
#   go lint and format     golangci-lint (includes gofmt and goimports)
#   go build               go build -trimpath ./...
#   go test                go test -race -count=1 -cover ./...
#   go module              go mod verify, go mod tidy -diff
#   shell                  shfmt and shellcheck
#   yaml                   yamllint
#   docker                 hadolint
#   workflows              actionlint
#   vuln                   govulncheck
#   harness image          sidecar image smoke
#   m0 protocol spike      unmodified oz-agent-worker against the M0 server
#   upcoming languages     TypeScript, Python, SQL, Helm, JSON Schema
#
# Not required, and not workflows yet:
#   markdownlint           docs are prose; a default ruleset fights the house style
#   gosec / revive         see .golangci.yml
#   coverage threshold     no agreed bar
#   CodeQL                 turn on after code scanning is enabled for the repo
#   nightly model e2e      docs/12; there is no fixture and it needs a local model
#   action SHA review      pins are updated by Dependabot, not by a status check
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  go-lint:
    name: go lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.5.0
          args: --timeout=5m
          install-mode: binary

  go-build:
    name: go build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build every package
        run: go build -trimpath ./...

  go-test:
    name: go test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test with the race detector
        run: go test -race -count=1 -cover ./...

  go-module:
    name: go module
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify and tidy the module
        run: |
          set -euo pipefail
          go mod verify
          go mod tidy -diff

  shell:
    name: shell
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install shellcheck and shfmt
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.local/bin"
          curl -fsSL -o /tmp/shellcheck.tar.xz \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          tar -C /tmp -xJf /tmp/shellcheck.tar.xz
          install -m 0755 /tmp/shellcheck-v0.11.0/shellcheck "${HOME}/.local/bin/shellcheck"
          curl -fsSL -o "${HOME}/.local/bin/shfmt" \
            https://github.com/mvdan/sh/releases/download/v3.14.1/shfmt_v3.14.1_linux_amd64
          chmod 0755 "${HOME}/.local/bin/shfmt"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      - name: Format and lint shell scripts
        run: |
          set -euo pipefail
          files=()
          while IFS= read -r -d '' file; do
            files+=("${file}")
          done < <(find . \( -path './.git' -o -path '*/.work' \) -prune -o -name '*.sh' -print0)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "no shell scripts found"
            exit 1
          fi
          # Printer flags override .editorconfig, so indent lives there.
          shfmt -d "${files[@]}"
          shellcheck -x "${files[@]}"

  yaml:
    name: yaml
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint YAML
        run: |
          set -euo pipefail
          python3 -m pip install --user 'yamllint==1.38.0'
          python3 -m yamllint -f github .

  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint Dockerfiles
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.local/bin"
          curl -fsSL -o /tmp/hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.14.0/hadolint-Linux-x86_64
          install -m 0755 /tmp/hadolint "${HOME}/.local/bin/hadolint"
          files=()
          while IFS= read -r -d '' file; do
            files+=("${file}")
          done < <(find . \( -path './.git' -o -path '*/.work' \) -prune -o -name 'Dockerfile' -print0)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "no Dockerfiles found"
            exit 1
          fi
          "${HOME}/.local/bin/hadolint" "${files[@]}"

  actions:
    name: workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint workflows
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.local/bin"
          curl -fsSL -o /tmp/shellcheck.tar.xz \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          tar -C /tmp -xJf /tmp/shellcheck.tar.xz
          install -m 0755 /tmp/shellcheck-v0.11.0/shellcheck "${HOME}/.local/bin/shellcheck"
          curl -fsSL -o /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          tar -C "${HOME}/.local/bin" -xzf /tmp/actionlint.tar.gz actionlint
          export PATH="${HOME}/.local/bin:${PATH}"
          actionlint -color

  vuln:
    name: vuln
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

  harness-image:
    name: harness image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build the sidecar and run one invocation
        run: ./harness/generic-openai/smoke.sh

  protocol-spike:
    name: m0 protocol spike
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run an unmodified worker against the M0 server
        run: ./spike/m0/run.sh

  upcoming-languages:
    name: upcoming languages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint TypeScript, Python, SQL, Helm, and JSON Schema when present
        run: ./scripts/ci/lint-upcoming.sh

  required:
    name: required
    needs:
      - go-lint
      - go-build
      - go-test
      - go-module
      - shell
      - yaml
      - docker
      - actions
      - vuln
      - harness-image
      - protocol-spike
      - upcoming-languages
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every required job succeeded
        env:
          GO_LINT: ${{ needs.go-lint.result }}
          GO_BUILD: ${{ needs.go-build.result }}
          GO_TEST: ${{ needs.go-test.result }}
          GO_MODULE: ${{ needs.go-module.result }}
          SHELL_LINT: ${{ needs.shell.result }}
          YAML_LINT: ${{ needs.yaml.result }}
          DOCKER_LINT: ${{ needs.docker.result }}
          ACTIONS_LINT: ${{ needs.actions.result }}
          VULN: ${{ needs.vuln.result }}
          HARNESS_IMAGE: ${{ needs.harness-image.result }}
          PROTOCOL_SPIKE: ${{ needs.protocol-spike.result }}
          UPCOMING: ${{ needs.upcoming-languages.result }}
        run: |
          set -euo pipefail
          fail=0
          report() {
            printf '%-22s %s\n' "$1" "$2"
            if [[ "$2" != success ]]; then
              fail=1
            fi
            printf '| %s | %s |\n' "$1" "$2" >> "${GITHUB_STEP_SUMMARY}"
          }
          {
            echo "## Required checks"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
          } >> "${GITHUB_STEP_SUMMARY}"
          report "go lint and format" "${GO_LINT}"
          report "go build" "${GO_BUILD}"
          report "go test" "${GO_TEST}"
          report "go module" "${GO_MODULE}"
          report "shell" "${SHELL_LINT}"
          report "yaml" "${YAML_LINT}"
          report "docker" "${DOCKER_LINT}"
          report "workflows" "${ACTIONS_LINT}"
          report "vuln" "${VULN}"
          report "harness image" "${HARNESS_IMAGE}"
          report "m0 protocol spike" "${PROTOCOL_SPIKE}"
          report "upcoming languages" "${UPCOMING}"
          exit "${fail}"
