# Required CI.
#
# Branch protection should require the single check named `required`.
# That job fails unless every job below succeeded, including jobs for
# languages that are not in the tree yet (those pass until their files
# land, then fail closed).
#
# Mark these required by requiring `required`. Do not also require the
# individual job names unless you want a branch-protection edit every
# time a job is added.
#
#   go lint and format     golangci-lint (includes gofmt and goimports)
#   go build               go build -trimpath ./...
#   go test                go test -race -count=1 -cover -v ./...
#                          Postgres 16 and MinIO, so store/server/S3 tests run
#   go module              go mod verify, go mod tidy -diff
#   shell                  shfmt and shellcheck
#   yaml                   yamllint
#   docker                 hadolint
#   workflows              actionlint
#   vuln                   govulncheck
#   harness image          sidecar image smoke
#   m0 protocol spike      unmodified oz-agent-worker against the M0 server
#   m1 offline e2e         MODE=offline ./spike/m1/run.sh
#   m2 offline e2e         MODE=offline ./spike/m2/run.sh
#   task image platform    task and harness images built for linux/arm64
#   upcoming languages     TypeScript, Python, SQL, Helm, JSON Schema
#
# Not required, and not workflows yet:
#   markdownlint           docs are prose; a default ruleset fights the house style
#   gosec / revive         see .golangci.yml
#   coverage threshold     no agreed bar
#   CodeQL                 turn on after code scanning is enabled for the repo
#   nightly model e2e      docs/12; there is no fixture and it needs a local model
#   action SHA review      pins are updated by Dependabot, not by a status check
# Manual, not part of `required`:
#   m1 live                .github/workflows/m1-live.yml (workflow_dispatch)
#   m2 live                .github/workflows/m2-live.yml (workflow_dispatch)
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  go-lint:
    name: go lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          args: --timeout=5m
          install-mode: binary

  go-build:
    name: go build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build every package
        run: go build -trimpath ./...
      - name: M2 run.sh unit tests
        run: M2_REQUIRE_GO=1 ./spike/m2/run_test.sh

  go-test:
    name: go test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Store and server tests skip without FACTORY_TEST_DATABASE_URL (that
    # left store coverage at 6.4%). The S3 round-trip skips without
    # FACTORY_TEST_S3_ENDPOINT. Services are healthy before steps run.
    # MinIO uses the image entrypoint and default command (no `server /data`).
    # MINIO_ROOT_USER is factoryadmin, at least 3 characters, and matches
    # FACTORY_TEST_S3_KEY. The client image creates the `factory` bucket;
    # a service cannot override that image's command without replacing
    # its entrypoint, and the default command exits.
    env:
      FACTORY_TEST_DATABASE_URL: "postgres://postgres:t@127.0.0.1:5432/factory?sslmode=disable"
      FACTORY_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      FACTORY_TEST_S3_KEY: factoryadmin
      FACTORY_TEST_S3_SECRET: factorysecret
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: t
          POSTGRES_DB: factory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d factory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      minio:
        image: "bitnamilegacy/minio:2025.7.23-debian-12-r5\
          @sha256:6dabb4a2088c9a79908de3bc05f4586c23ad2182c8908e7e3acbf61c1467fb20"
        env:
          MINIO_ROOT_USER: factoryadmin
          MINIO_ROOT_PASSWORD: factorysecret
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -fsS http://127.0.0.1:9000/minio/health/ready"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 10s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Create the MinIO test bucket
        run: |
          set -euo pipefail
          mc_image='bitnamilegacy/minio-client:2025.7.21-debian-12-r3'
          mc_image+='@sha256:73bd39f7899a0cef12b8dd5df13aa93a3ed1aaa44236542442e9ac76819ac158'
          docker run --rm --network host \
            -e HOME=/tmp \
            -e MINIO_ROOT_USER="${FACTORY_TEST_S3_KEY}" \
            -e MINIO_ROOT_PASSWORD="${FACTORY_TEST_S3_SECRET}" \
            "$mc_image" \
            /bin/bash -ec '
              set -euo pipefail
              mkdir -p /tmp/mc
              ok=0
              for _ in $(seq 1 30); do
                if mc --config-dir /tmp/mc alias set local http://127.0.0.1:9000 \
                  "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; then
                  ok=1
                  break
                fi
                sleep 2
              done
              if [[ "$ok" -ne 1 ]]; then
                echo "minio did not accept the test credentials" >&2
                exit 1
              fi
              mc --config-dir /tmp/mc mb --ignore-existing local/factory
              mc --config-dir /tmp/mc anonymous set none local/factory
            '
      - name: Test with the race detector
        run: go test -race -count=1 -cover -v ./...

  go-module:
    name: go module
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify and tidy the module
        run: |
          set -euo pipefail
          go mod verify
          go mod tidy -diff

  shell:
    name: shell
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install shellcheck and shfmt
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.local/bin"
          curl -fsSL -o /tmp/shellcheck.tar.xz \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          tar -C /tmp -xJf /tmp/shellcheck.tar.xz
          install -m 0755 /tmp/shellcheck-v0.11.0/shellcheck "${HOME}/.local/bin/shellcheck"
          curl -fsSL -o "${HOME}/.local/bin/shfmt" \
            https://github.com/mvdan/sh/releases/download/v3.14.1/shfmt_v3.14.1_linux_amd64
          chmod 0755 "${HOME}/.local/bin/shfmt"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      - name: Format and lint shell scripts
        run: |
          set -euo pipefail
          files=()
          while IFS= read -r -d '' file; do
            files+=("${file}")
          done < <(find . \( -path './.git' -o -path '*/.work' \) -prune -o -name '*.sh' -print0)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "no shell scripts found"
            exit 1
          fi
          # Printer flags override .editorconfig, so indent lives there.
          shfmt -d "${files[@]}"
          shellcheck -x "${files[@]}"
      - name: M2 run.sh unit tests
        run: ./spike/m2/run_test.sh

  yaml:
    name: yaml
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint YAML
        run: |
          set -euo pipefail
          python3 -m pip install --user 'yamllint==1.38.0'
          python3 -m yamllint -f github .

  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint Dockerfiles
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.local/bin"
          curl -fsSL -o /tmp/hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.14.0/hadolint-Linux-x86_64
          install -m 0755 /tmp/hadolint "${HOME}/.local/bin/hadolint"
          files=()
          while IFS= read -r -d '' file; do
            files+=("${file}")
          done < <(find . \( -path './.git' -o -path '*/.work' \) -prune -o -name 'Dockerfile' -print0)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "no Dockerfiles found"
            exit 1
          fi
          "${HOME}/.local/bin/hadolint" "${files[@]}"

  actions:
    name: workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint workflows
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.local/bin"
          curl -fsSL -o /tmp/shellcheck.tar.xz \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          tar -C /tmp -xJf /tmp/shellcheck.tar.xz
          install -m 0755 /tmp/shellcheck-v0.11.0/shellcheck "${HOME}/.local/bin/shellcheck"
          curl -fsSL -o /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          tar -C "${HOME}/.local/bin" -xzf /tmp/actionlint.tar.gz actionlint
          export PATH="${HOME}/.local/bin:${PATH}"
          actionlint -color

  vuln:
    name: vuln
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

  harness-image:
    name: harness image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build the sidecar and run one invocation
        run: ./harness/generic-openai/smoke.sh

  protocol-spike:
    name: m0 protocol spike
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run an unmodified worker against the M0 server
        run: ./spike/m0/run.sh

  m1-offline:
    name: m1 offline e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run the offline M1 driver
        run: MODE=offline ./spike/m1/run.sh

  m2-offline:
    name: m2 offline e2e
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run the offline M2 driver
        run: MODE=offline ./spike/m2/run.sh

  task-image-arch:
    name: task image platform
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Enable arm64 emulation
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-user-static
      - name: Build the task and harness images for linux/arm64
        run: ./spike/m2/check-image-platform.sh linux/arm64

  upcoming-languages:
    name: upcoming languages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint TypeScript, Python, SQL, Helm, and JSON Schema when present
        run: ./scripts/ci/lint-upcoming.sh

  required:
    name: required
    needs:
      - go-lint
      - go-build
      - go-test
      - go-module
      - shell
      - yaml
      - docker
      - actions
      - vuln
      - harness-image
      - protocol-spike
      - m1-offline
      - m2-offline
      - task-image-arch
      - upcoming-languages
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every required job succeeded
        env:
          GO_LINT: ${{ needs.go-lint.result }}
          GO_BUILD: ${{ needs.go-build.result }}
          GO_TEST: ${{ needs.go-test.result }}
          GO_MODULE: ${{ needs.go-module.result }}
          SHELL_LINT: ${{ needs.shell.result }}
          YAML_LINT: ${{ needs.yaml.result }}
          DOCKER_LINT: ${{ needs.docker.result }}
          ACTIONS_LINT: ${{ needs.actions.result }}
          VULN: ${{ needs.vuln.result }}
          HARNESS_IMAGE: ${{ needs.harness-image.result }}
          PROTOCOL_SPIKE: ${{ needs.protocol-spike.result }}
          M1_OFFLINE: ${{ needs.m1-offline.result }}
          M2_OFFLINE: ${{ needs.m2-offline.result }}
          TASK_IMAGE_ARCH: ${{ needs.task-image-arch.result }}
          UPCOMING: ${{ needs.upcoming-languages.result }}
        run: |
          set -euo pipefail
          fail=0
          report() {
            printf '%-22s %s\n' "$1" "$2"
            if [[ "$2" != success ]]; then
              fail=1
            fi
            printf '| %s | %s |\n' "$1" "$2" >> "${GITHUB_STEP_SUMMARY}"
          }
          {
            echo "## Required checks"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
          } >> "${GITHUB_STEP_SUMMARY}"
          report "go lint and format" "${GO_LINT}"
          report "go build" "${GO_BUILD}"
          report "go test" "${GO_TEST}"
          report "go module" "${GO_MODULE}"
          report "shell" "${SHELL_LINT}"
          report "yaml" "${YAML_LINT}"
          report "docker" "${DOCKER_LINT}"
          report "workflows" "${ACTIONS_LINT}"
          report "vuln" "${VULN}"
          report "harness image" "${HARNESS_IMAGE}"
          report "m0 protocol spike" "${PROTOCOL_SPIKE}"
          report "m1 offline e2e" "${M1_OFFLINE}"
          report "m2 offline e2e" "${M2_OFFLINE}"
          report "task image platform" "${TASK_IMAGE_ARCH}"
          report "upcoming languages" "${UPCOMING}"
          exit "${fail}"
