# Chart-only factory. global.image.tag is required: an empty tag or "latest"
# fails helm template. operator.enabled renders the operator resources. installCRDs does not gate crds/.
global:
  image:
    registry: ghcr.io/acme
    pullPolicy: IfNotPresent
    tag: ""
  imagePullSecrets:
    - name: ghcr-pull

nameOverride: ""
fullnameOverride: ""

controlPlane:
  enabled: true
  replicas: 2
  image:
    repository: factoryd
  externalUrl: https://factory.acme.internal
  # Empty uses the in-cluster Service DNS so task pods in the task namespace
  # can reach factoryd without the public ingress.
  taskServerURL: ""
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      memory: 2Gi
  ingress:
    enabled: true
    className: nginx
    host: factory.acme.internal
    tls:
      secretName: factory-tls
  serviceAccount:
    annotations: {}
  database:
    # Secret keys: host, port, user, password, dbname, and url.
    # factoryd reads FACTORY_DATABASE_URL, so url is the consumed key.
    existingSecret: factory-postgres
    urlKey: url
    sslMode: require
  objectStore:
    endpoint: https://s3.us-west-2.amazonaws.com
    bucket: acme-factory
    region: us-west-2
    existingSecret: factory-s3
    accessKeyKey: accessKey
    secretKeyKey: secretKey
    forcePathStyle: false
    irsa: false
  api:
    create: false
    existingSecret: factory-api
    apiKeyKey: FACTORY_API_KEY
    workerKeyKey: FACTORY_WORKER_API_KEY
    apiKey: ""
    workerKey: ""
  auth:
    oidc:
      issuer: https://login.acme.com
      clientId: factory
      existingSecret: factory-oidc
  inference:
    providers:
      anthropic:
        existingSecret: anthropic-api-key
  telemetry:
    otlpEndpoint: http://otel-collector.observability.svc:4318
  definition:
    existingConfigMap: ""
    mountPath: /definitions/factory
    files:
      factory.yaml: |
        schemaVersion: v1alpha1
        name: factory
        description: Chart-installed factory. Replace this tree to run real work.
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
  # Generic pod knobs. Empty lists render nothing, so the default, dev, and
  # multi-pool manifests stay byte-identical. No credential-shaped keys.
  extraEnv: []
  extraEnvFrom: []
  extraVolumes: []
  extraVolumeMounts: []
  # Opt-in projected Kubernetes secret files for G18 resolver mounts (M10-S).
  # Disabled by default; does not change chart-only installs.
  secretProjection:
    enabled: false
    mountPath: /var/run/factory/secrets
    sources: []
    # - secretName: factory-task-secrets
    #   defaultMode: 384
    #   items:
    #     - key: SCAN_GITHUB_TOKEN
    #       path: SCAN_GITHUB_TOKEN

# Opt-in G14/G18 synthetic enforcement templates (NetworkPolicy, docs hooks).
# Helm render success is not Docker-host or live-cluster attestation.
scanSecurity:
  enabled: false
  egress:
    networkPolicy: false
    requireCNI: false
    # When requireCNI is true, chart adds pod annotation factory.dev/require-cni.
    cniProvider: ""
    # Named routes the egress proxy may open. The NetworkPolicy does not
    # allow 0.0.0.0/0; tasks may egress only to kube-dns and this proxy.
    proxyPort: 8443
    routes:
      - name: forge-api
        host: api.github.com
        port: 443
      - name: control-plane
        host: factory.example.internal
        port: 443

# In-chart Postgres is dev/eval only. Off by default.
postgresql:
  enabled: false
  image:
    repository: postgres
    tag: 16-alpine
    digest: sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
  auth:
    username: factory
    password: factory
    database: factory
  persistence:
    size: 1Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi

# In-chart MinIO is dev/eval only. Off by default.
minio:
  enabled: false
  image:
    repository: bitnamilegacy/minio
    tag: 2025.7.23-debian-12-r5
    digest: sha256:6dabb4a2088c9a79908de3bc05f4586c23ad2182c8908e7e3acbf61c1467fb20
  clientImage:
    repository: bitnamilegacy/minio-client
    tag: 2025.7.21-debian-12-r3
    digest: sha256:73bd39f7899a0cef12b8dd5df13aa93a3ed1aaa44236542442e9ac76819ac158
  auth:
    rootUser: factoryadmin
    rootPassword: factorysecret
  bucket: factory
  persistence:
    size: 1Gi
  resources:
    requests:
      cpu: 50m
      memory: 256Mi

operator:
  enabled: false
  installCRDs: false
  replicas: 1
  image:
    repository: factory-operator
  watchNamespaces: []
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  admissionWebhook:
    enabled: true
    certManager: false
  workerPools:
    taskNamespaces:
      - factory-runs
    apiKeySecret:
      name: factory-worker
      key: FACTORY_API_KEY

worker:
  image:
    repository: oz-agent-worker

workers:
  - name: standard
    enabled: true
    backend: kubernetes
    replicas: 2
    workerId: k8s-standard
    pool: standard
    maxConcurrentTasks: 8
    logLevel: info
    cleanup: true
    # Pod grace only. Upstream oz-agent-worker 63dbb8a bounds backend
    # shutdown at 10s and preserves Jobs. The operator cancel grace is 120s.
    terminationGracePeriodSeconds: 600
    apiKeySecret:
      name: factory-worker
      key: FACTORY_API_KEY
      create: false
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
    nodeSelector: {}
    tolerations: []
    affinity: {}
    metrics:
      enabled: true
      exporter: prometheus
      port: 9464
    kubernetesBackend:
      namespace: factory-runs
      defaultImage: ubuntu:22.04
      imagePullPolicy: IfNotPresent
      useImageVolumes: false
      preflightImage: busybox:1.36
      activeDeadlineSeconds: 28800
      ttlSecondsAfterFinished: 86400
      workspaceSizeLimit: 20Gi
      unschedulableTimeout: 10m
      extraAnnotations:
        karpenter.sh/do-not-disrupt: "true"
      extraLabels: {}
      podTemplate: {}
      preflightResources: {}
  - name: proof
    enabled: true
    proof: true
    backend: kubernetes
    replicas: 1
    workerId: proof-worker
    pool: proof
    maxConcurrentTasks: 1
    logLevel: info
    cleanup: true
    terminationGracePeriodSeconds: 600
    apiKeySecret:
      name: factory-worker
      key: FACTORY_API_KEY
      create: false
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
    nodeSelector: {}
    tolerations: []
    affinity: {}
    metrics:
      enabled: false
      exporter: prometheus
      port: 9464
    kubernetesBackend:
      namespace: factory-runs
      defaultImage: ubuntu:22.04
      imagePullPolicy: IfNotPresent
      useImageVolumes: false
      preflightImage: busybox:1.36
      activeDeadlineSeconds: 28800
      ttlSecondsAfterFinished: 86400
      workspaceSizeLimit: 20Gi
      unschedulableTimeout: 10m
      extraAnnotations: {}
      extraLabels: {}
      podTemplate: {}
      preflightResources: {}
