# Dev/eval overlay: in-chart Postgres and MinIO, local image names, one worker.
# Pass a pinned tag (this file sets global.image.tag).
global:
  image:
    registry: ""
    pullPolicy: IfNotPresent
    tag: dev
  imagePullSecrets: []

controlPlane:
  replicas: 1
  image:
    repository: factoryd
  externalUrl: ""
  taskServerURL: ""
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  ingress:
    enabled: false
  api:
    create: true
    apiKey: dev-api-key
    workerKey: dev-worker-key
  definition:
    files:
      factory.yaml: |
        schemaVersion: v1alpha1
        name: dev
        description: Chart dev factory for kind. Replace this tree to run real work.

postgresql:
  enabled: true

minio:
  enabled: true

worker:
  image:
    repository: factory-upstream-worker

workers:
  - name: standard
    enabled: true
    backend: kubernetes
    replicas: 1
    workerId: k8s-standard
    pool: standard
    maxConcurrentTasks: 4
    logLevel: info
    cleanup: true
    terminationGracePeriodSeconds: 600
    apiKeySecret:
      name: factory-worker
      key: FACTORY_API_KEY
      create: false
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
    nodeSelector: {}
    tolerations: []
    affinity: {}
    metrics:
      enabled: true
      exporter: prometheus
      port: 9464
    kubernetesBackend:
      namespace: factory-runs
      defaultImage: ubuntu:22.04
      imagePullPolicy: IfNotPresent
      useImageVolumes: false
      preflightImage: busybox:1.36
      activeDeadlineSeconds: 28800
      ttlSecondsAfterFinished: 86400
      workspaceSizeLimit: 1Gi
      unschedulableTimeout: 10m
      extraAnnotations:
        karpenter.sh/do-not-disrupt: "true"
      extraLabels: {}
      podTemplate: {}
      preflightResources: {}
