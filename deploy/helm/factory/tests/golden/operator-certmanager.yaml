apiVersion: batch/v1
kind: Job
metadata:
  name: factory-worker-standard-preflight
  namespace: factory
  labels:
    helm.sh/chart: factory-0.1.0
    app.kubernetes.io/name: factory
    app.kubernetes.io/instance: factory
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: factory
    app.kubernetes.io/component: preflight
    factory.dev/pool: "standard"
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 180
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: factory
        app.kubernetes.io/instance: factory
        app.kubernetes.io/component: preflight
        factory.dev/pool: "standard"
    spec:
      restartPolicy: Never
      serviceAccountName: factory-worker-standard
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: preflight
          image: "ghcr.io/acme/oz-agent-worker:test"
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              log=/tmp/worker.log
              /oz-agent-worker \
                --config-file /etc/oz-agent-worker/config.yaml \
                --backend kubernetes \
                --log-level "$PREFLIGHT_LOG_LEVEL" \
                --web-socket-url "$PREFLIGHT_WS" \
                --server-root-url "$PREFLIGHT_ROOT" \
                >"$log" 2>&1 &
              pid=$!
              i=0
              while [ "$i" -lt 90 ]; do
                if grep -q "Connecting to" "$log"; then
                  cat "$log"
                  kill "$pid" 2>/dev/null || true
                  wait "$pid" 2>/dev/null || true
                  exit 0
                fi
                if ! kill -0 "$pid" 2>/dev/null; then
                  cat "$log" >&2
                  exit 1
                fi
                i=$((i + 1))
                sleep 1
              done
              cat "$log" >&2
              kill "$pid" 2>/dev/null || true
              exit 1
          env:
            - name: PREFLIGHT_LOG_LEVEL
              value: "info"
            - name: PREFLIGHT_WS
              value: "ws://factory-factoryd.factory.svc:8080/api/v1/selfhosted/worker/ws"
            - name: PREFLIGHT_ROOT
              value: "http://factory-factoryd.factory.svc:8080"
            - name: WARP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: factory-worker
                  key: FACTORY_API_KEY
            - name: OTEL_METRICS_EXPORTER
              value: "none"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: config
              mountPath: /etc/oz-agent-worker
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: factory-worker-standard-config
