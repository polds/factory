apiVersion: batch/v1
kind: Job
metadata:
  name: factory-migrate
  namespace: factory
  labels:
    helm.sh/chart: factory-0.1.0
    app.kubernetes.io/name: factory
    app.kubernetes.io/instance: factory
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: factory
    app.kubernetes.io/component: migration
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: factory
        app.kubernetes.io/instance: factory
        app.kubernetes.io/component: migration
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: "postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab"
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until pg_isready -h "$PGHOST" -p 5432 -U "$PGUSER" -d "$PGDATABASE"; do sleep 2; done
          env:
            - name: PGHOST
              value: "factory-postgresql"
            - name: PGUSER
              value: "factory"
            - name: PGDATABASE
              value: "factory"
      containers:
        - name: migrate
          image: "factoryd:dev"
          imagePullPolicy: IfNotPresent
          args: ["migrate", "up"]
          env:
            - name: FACTORY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: factory-postgresql
                  key: url
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
