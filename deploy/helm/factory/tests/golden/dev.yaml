apiVersion: batch/v1
kind: Job
metadata:
  name: factory-minio-init
  namespace: factory
  labels:
    helm.sh/chart: factory-0.1.0
    app.kubernetes.io/name: factory
    app.kubernetes.io/instance: factory
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: factory
    app.kubernetes.io/component: minio
    factory.dev/dev-eval: "true"
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: factory
        app.kubernetes.io/instance: factory
        app.kubernetes.io/component: minio-init
        factory.dev/dev-eval: "true"
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: minio-init
          image: "bitnamilegacy/minio-client:2025.7.21-debian-12-r3@sha256:73bd39f7899a0cef12b8dd5df13aa93a3ed1aaa44236542442e9ac76819ac158"
          imagePullPolicy: IfNotPresent
          env:
            - name: MINIO_HOST
              value: "factory-minio"
            - name: MINIO_BUCKET
              value: "factory"
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: factory-minio
                  key: accessKey
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: factory-minio
                  key: secretKey
          command: ["/bin/bash", "-ec"]
          args:
            - |
              mkdir -p /tmp/mc
              ok=0
              i=0
              while [ "$i" -lt 60 ]; do
                if mc --config-dir /tmp/mc alias set local "http://${MINIO_HOST}:9000" \
                  "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" \
                  && mc --config-dir /tmp/mc mb --ignore-existing "local/${MINIO_BUCKET}" \
                  && mc --config-dir /tmp/mc anonymous set none "local/${MINIO_BUCKET}"; then
                  ok=1
                  break
                fi
                i=$((i + 1))
                sleep 2
              done
              if [ "$ok" -ne 1 ]; then
                echo "minio did not accept bucket setup" >&2
                exit 1
              fi
