# yamllint disable-file
# Exact copy of warpdotdev/oz-agent-worker charts/oz-agent-worker/templates/role.yaml
# at 63dbb8ae8ccb3941392691f5c628e3365d8e248e.
{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "oz-agent-worker.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "oz-agent-worker.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list"]
{{- end }}
