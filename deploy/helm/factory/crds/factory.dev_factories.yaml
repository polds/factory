---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: factories.factory.dev
spec:
  group: factory.dev
  names:
    kind: Factory
    listKind: FactoryList
    plural: factories
    singular: factory
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Factory is the factory.yaml document for one factory.
          metadata.name is the factoryd factory name (D12).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: FactorySpec is the desired factory definition.
            properties:
              agentDefaults:
                description: AgentDefaultsSpec is factory.spec.agentDefaults.
                properties:
                  computerUseModel:
                    type: string
                  credentialStrategy:
                    type: string
                  harness:
                    description: HarnessSpec is an explicit harness. It is mutually
                      exclusive with model.
                    properties:
                      auth:
                        description: HarnessAuthSpec names a harness credential. SecretName
                          is a name.
                        properties:
                          secretName:
                            type: string
                          source:
                            type: string
                        type: object
                      model:
                        type: string
                      type:
                        type: string
                    type: object
                  idleTimeoutMinutes:
                    format: int32
                    type: integer
                  maxTurns:
                    format: int32
                    type: integer
                  mcpServers:
                    additionalProperties:
                      description: |-
                        MCPServerSpec is one MCP server. Header and env values are either a
                        secretKeyRef object or a {{SECRET_NAME}} string, never credential material.
                      properties:
                        args:
                          items:
                            type: string
                          type: array
                        command:
                          type: string
                        env:
                          x-kubernetes-preserve-unknown-fields: true
                        headers:
                          x-kubernetes-preserve-unknown-fields: true
                        url:
                          type: string
                      type: object
                    type: object
                  model:
                    type: string
                  pool:
                    type: string
                  poolRef:
                    description: LocalRef names a resource in the same namespace (D12).
                    properties:
                      name:
                        type: string
                    required:
                    - name
                    type: object
                  runner:
                    type: string
                  secrets:
                    items:
                      type: string
                    type: array
                  workerHost:
                    type: string
                type: object
              alias:
                type: string
              codeForges:
                items:
                  type: string
                type: array
              credentialStrategy:
                type: string
              description:
                type: string
              displayName:
                type: string
              files:
                description: Files is the lossless factory.yaml. When set, convert
                  prefers it.
                items:
                  description: |-
                    SourceFile is one definition-tree file.

                    Content is what factoryctl convert writes back. Inline credential values
                    are removed before Content is stored. secretRefs, credentialRef, and
                    secretName stay names.
                  properties:
                    content:
                      type: string
                    path:
                      type: string
                  required:
                  - content
                  - path
                  type: object
                type: array
              inference:
                description: InferenceSpec is factory.spec.inference. CredentialRef
                  is a name.
                properties:
                  default:
                    description: InferenceDefaultSpec selects the default provider.
                    properties:
                      credentialRef:
                        type: string
                      provider:
                        type: string
                    type: object
                  providers:
                    additionalProperties:
                      description: InferenceProviderSpec is one named provider. CredentialRef
                        is a name.
                      properties:
                        baseUrl:
                          type: string
                        credentialRef:
                          type: string
                        kind:
                          type: string
                        region:
                          type: string
                        roleArn:
                          type: string
                      type: object
                    type: object
                type: object
              mcpServers:
                additionalProperties:
                  description: |-
                    MCPServerSpec is one MCP server. Header and env values are either a
                    secretKeyRef object or a {{SECRET_NAME}} string, never credential material.
                  properties:
                    args:
                      items:
                        type: string
                      type: array
                    command:
                      type: string
                    env:
                      x-kubernetes-preserve-unknown-fields: true
                    headers:
                      x-kubernetes-preserve-unknown-fields: true
                    url:
                      type: string
                  type: object
                type: object
              pipeline:
                description: PipelineSpec is the declarative stage machine.
                properties:
                  agents:
                    additionalProperties:
                      type: string
                    type: object
                  approvals:
                    additionalProperties:
                      description: ApprovalSpec is one pipeline.approvals entry.
                      properties:
                        approvers:
                          type: string
                        required:
                          type: boolean
                      required:
                      - required
                      type: object
                    type: object
                  revisionLimit:
                    format: int32
                    type: integer
                  skip:
                    additionalProperties:
                      type: string
                    type: object
                  stages:
                    items:
                      type: string
                    type: array
                type: object
              repositories:
                items:
                  description: RepositoryRef is a code-forge repository.
                  properties:
                    codeForge:
                      type: string
                    deferred:
                      type: boolean
                    name:
                      type: string
                    owner:
                      type: string
                  type: object
                type: array
              schemaVersion:
                type: string
              scorerDefaults:
                description: ScorerDefaultsSpec is factory.spec.scorerDefaults.
                properties:
                  mcpServers:
                    additionalProperties:
                      description: |-
                        MCPServerSpec is one MCP server. Header and env values are either a
                        secretKeyRef object or a {{SECRET_NAME}} string, never credential material.
                      properties:
                        args:
                          items:
                            type: string
                          type: array
                        command:
                          type: string
                        env:
                          x-kubernetes-preserve-unknown-fields: true
                        headers:
                          x-kubernetes-preserve-unknown-fields: true
                        url:
                          type: string
                      type: object
                    type: object
                  model:
                    type: string
                  runner:
                    type: string
                  secrets:
                    items:
                      type: string
                    type: array
                type: object
              secretRefs:
                items:
                  description: |-
                    SecretRef names a secret. Name is the secret's name. As is the env var
                    that name is exposed as. Neither field holds secret material.
                  properties:
                    as:
                      type: string
                    name:
                      type: string
                  required:
                  - name
                  type: object
                type: array
              secrets:
                items:
                  type: string
                type: array
              selfImprovement:
                description: |-
                  SelfImprovementSpec is factory.spec.selfImprovement.
                  reviewerEmails is non-empty if and only if reviewerType is custom.
                properties:
                  failedRunThreshold:
                    format: int32
                    type: integer
                  reviewerEmails:
                    items:
                      maxLength: 320
                      type: string
                    maxItems: 32
                    type: array
                  reviewerType:
                    enum:
                    - admins
                    - team
                    - custom
                    - none
                    type: string
                  staleFailureDays:
                    format: int32
                    type: integer
                type: object
                x-kubernetes-validations:
                - message: reviewerEmails must be non-empty if and only if reviewerType
                    is custom
                  rule: (has(self.reviewerType) && self.reviewerType == 'custom')
                    == (has(self.reviewerEmails) && size(self.reviewerEmails) > 0)
            type: object
          status:
            description: FactoryStatus is the operator's view of a Factory.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                format: int64
                type: integer
              phase:
                type: string
              resources:
                description: FactoryResourceCounts is status.resources.
                properties:
                  agents:
                    format: int32
                    type: integer
                  automations:
                    format: int32
                    type: integer
                  runners:
                    format: int32
                    type: integer
                  scorers:
                    format: int32
                    type: integer
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
