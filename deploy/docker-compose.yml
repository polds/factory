# Single-node factory stack (laptop profile).
#
#   cp .env.example .env
#   docker compose up -d --build --wait
#   factoryctl run --prompt "…" --watch
#
# Profiles:
#   (default)  factoryd + postgres + minio + one docker-backend worker
#   migrate    one-shot `factoryd migrate up` (also runs on factoryd boot)
#   oidc       Dex for local OIDC login
#   otel       OpenTelemetry collector
#
# `up --wait` fails if any container has exited, including a successful
# one-shot, so migrate is not in the default project. factoryd serve
# migrates on boot. Run the subcommand on its own with:
#
#   docker compose --profile migrate run --rm migrate
#
# Task containers are created by the worker on the host Docker bridge, not
# on this compose network. They cannot resolve the service name factoryd.
# factoryd publishes 8080 on the host, and FACTORY_TASK_SERVER_URL defaults
# to http://172.17.0.1:8080 (the Linux bridge gateway). Docker Desktop
# should set http://host.docker.internal:8080. spike/m2/run.sh detects the
# bridge gateway and exports the URL it measured. A loopback model URL is
# host.docker.internal on Docker Desktop and the gateway on Linux.
#
# Images are built locally (factoryd:dev, factory-upstream-worker:dev).
# MinIO is Bitnami Legacy: default entrypoint, no `server /data` override.
# MINIO_ROOT_USER must be at least 3 characters.

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-factoryd-image: &factoryd-image
  image: factoryd:dev
  build:
    context: ..
    dockerfile: deploy/factoryd/Dockerfile

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: factory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-factory}
      POSTGRES_DB: factory
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory -d factory"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5@sha256:6dabb4a2088c9a79908de3bc05f4586c23ad2182c8908e7e3acbf61c1467fb20
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-factoryadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-factorysecret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    logging: *logging

  # Creates the bucket, then stays up. An exited init container fails
  # `up --wait`. The entrypoint is the image default.
  minio-init:
    image: bitnamilegacy/minio-client:2025.7.21-debian-12-r3@sha256:73bd39f7899a0cef12b8dd5df13aa93a3ed1aaa44236542442e9ac76819ac158
    depends_on:
      minio: { condition: service_healthy }
    environment:
      HOME: /tmp
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-factoryadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-factorysecret}
    command:
      - /bin/bash
      - -ec
      - |
        mkdir -p /tmp/mc
        mc --config-dir /tmp/mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc --config-dir /tmp/mc mb --ignore-existing local/factory
        mc --config-dir /tmp/mc anonymous set none local/factory
        touch /tmp/bucket-ready
        sleep infinity
    healthcheck:
      test: ["CMD", "bash", "-c", "test -f /tmp/bucket-ready"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: "no"
    logging: *logging

  migrate:
    <<: *factoryd-image
    profiles: ["migrate"]
    depends_on:
      postgres: { condition: service_healthy }
    command: ["migrate", "up"]
    environment:
      FACTORY_DATABASE_URL: postgres://factory:${POSTGRES_PASSWORD:-factory}@postgres:5432/factory?sslmode=disable
    restart: "no"

  factoryd:
    <<: *factoryd-image
    restart: unless-stopped
    depends_on:
      postgres:   { condition: service_healthy }
      minio-init: { condition: service_healthy }
    ports:
      - "8080:8080"
    environment:
      FACTORY_HTTP_ADDR: ${FACTORY_HTTP_ADDR:-:8080}
      FACTORY_EXTERNAL_URL: ${FACTORY_EXTERNAL_URL:-http://localhost:8080}
      FACTORY_TASK_SERVER_URL: ${FACTORY_TASK_SERVER_URL:-http://172.17.0.1:8080}
      FACTORY_DATABASE_URL: postgres://factory:${POSTGRES_PASSWORD:-factory}@postgres:5432/factory?sslmode=disable
      FACTORY_API_KEY: ${FACTORY_API_KEY:-m2-dev-api-key}
      FACTORY_WORKER_API_KEY: ${FACTORY_WORKER_API_KEY:-m2-dev-worker-key}

      FACTORY_S3_ENDPOINT: http://minio:9000
      FACTORY_S3_BUCKET: factory
      FACTORY_S3_ACCESS_KEY: ${S3_ACCESS_KEY:-factoryadmin}
      FACTORY_S3_SECRET_KEY: ${S3_SECRET_KEY:-factorysecret}
      FACTORY_S3_REGION: ${FACTORY_S3_REGION:-us-east-1}
      FACTORY_S3_FORCE_PATH_STYLE: "true"

      FACTORY_DEFINITION_PATH: /definitions/m2-factory

      FACTORY_INFERENCE_OPENAI_COMPATIBLE_BASE_URL: ${FACTORY_INFERENCE_OPENAI_COMPATIBLE_BASE_URL:-}
      FACTORY_INFERENCE_OPENAI_API_KEY: ${FACTORY_INFERENCE_OPENAI_API_KEY:-}
      FACTORY_SECRET_GH_TOKEN: ${FACTORY_SECRET_GH_TOKEN:-}

      FACTORY_WORKER_POOL: ${FACTORY_WORKER_POOL:-standard}
      FACTORY_WORKER_PLATFORM: ${FACTORY_WORKER_PLATFORM:-linux}
      FACTORY_WORKER_MAX_CONCURRENT: ${FACTORY_WORKER_MAX_CONCURRENT:-1}

      FACTORY_LOG_LEVEL: ${FACTORY_LOG_LEVEL:-info}

      # Parked. factoryd does not read these; the pieces are not in M2.
      # FACTORY_SECRETS_PROVIDER: postgres-encrypted
      # FACTORY_SECRETS_MASTER_KEY:
      # FACTORY_INFERENCE_ANTHROPIC_API_KEY:
      # FACTORY_GITHUB_APP_ID:
      # FACTORY_GITHUB_APP_PRIVATE_KEY:
      # FACTORY_GITHUB_WEBHOOK_SECRET:
      # FACTORY_AUTH_MODE: dev-single-user
      # FACTORY_DEV_USER_EMAIL: dev@localhost
    volumes:
      - ${FACTORY_DEFINITION_HOST_PATH:-./m2-factory}:/definitions/m2-factory:ro
    healthcheck:
      test: ["CMD", "/factoryd", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    logging: *logging

  # Unmodified upstream worker (63dbb8a), Docker backend. There is no
  # --pool flag; factoryd's FACTORY_WORKER_POOL is the scheduler pool.
  # WARP_API_KEY is the worker bearer (FACTORY_WORKER_API_KEY).
  worker:
    image: factory-upstream-worker:dev
    build:
      context: ./worker
    restart: unless-stopped
    depends_on:
      factoryd: { condition: service_healthy }
    command:
      - --worker-id=local-1
      - --backend=docker
      - --config-file=/etc/factory/worker.yaml
      - --max-concurrent-tasks=1
      - --web-socket-url=ws://factoryd:8080/api/v1/selfhosted/worker/ws
      - --server-root-url=http://factoryd:8080
      - --idle-on-complete=0s
      - --log-level=info
    environment:
      WARP_API_KEY: ${FACTORY_WORKER_API_KEY:-m2-dev-worker-key}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../spike/m2/worker.yaml:/etc/factory/worker.yaml:ro
    stop_grace_period: 30s
    logging: *logging

  dex:
    profiles: ["oidc"]
    image: dexidp/dex:latest
    restart: unless-stopped
    ports:
      - "5556:5556"
    volumes:
      - ./dex/config.yaml:/etc/dex/config.yaml:ro
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    logging: *logging

  otel-collector:
    profiles: ["otel"]
    image: otel/opentelemetry-collector-contrib:latest
    restart: unless-stopped
    volumes:
      - ./otel/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4318:4318"
    logging: *logging

volumes:
  pgdata:
  miniodata:
