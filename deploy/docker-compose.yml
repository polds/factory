# Single-node factory stack (laptop profile).
#
#   cp .env.example .env
#   docker compose up -d --build --wait
#   factoryctl run --prompt "…" --watch
#
# Profiles:
#   (default)  factoryd + postgres + minio + one docker-backend worker
#   migrate    one-shot `factoryd migrate up` (also runs on factoryd boot)
#   oidc       Dex for local OIDC login
#   otel       OpenTelemetry collector
#
# `up --wait` fails if any container has exited, including a successful
# one-shot, so migrate is not in the default project. factoryd serve
# migrates on boot. Run the subcommand on its own with:
#
#   docker compose --profile migrate run --rm migrate
#
# Task containers are created by the worker on the host Docker bridge, not
# on this compose network. They cannot resolve the service name factoryd.
# factoryd publishes 8080 on the host, and FACTORY_TASK_SERVER_URL defaults
# to http://172.17.0.1:8080 (the Linux bridge gateway). Docker Desktop
# should set http://host.docker.internal:8080. spike/m2/run.sh detects the
# bridge gateway and exports the URL it measured. A loopback model URL is
# host.docker.internal on Docker Desktop and the gateway on Linux for that
# script. spike/m3/run.sh does not rewrite a model URL. It keeps
# FACTORY_TASK_SERVER_URL when set, and on Linux fills the gateway when
# the variable is empty. Point the definition at deploy/m3-factory with
# FACTORY_DEFINITION_HOST_PATH, FACTORY_DEFINITION_MOUNT, and
# FACTORY_DEFINITION_PATH (see spike/m3/run.sh). The default tree is
# deploy/m2-factory.
#
# Profile m5 adds factoryd-git (console on 8081, its own database) for
# spike/m5/run.sh. That script also passes spike/m5/compose.yml, which
# mounts a writable definition parent and drops the worker idle flag.
# The default project does not start the git factory.
#
# Profile m4 adds fake-github and fake-slack for spike/m4/run.sh. That
# script also passes spike/m4/compose.yml, which injects the M4 environment
# into factoryd and mounts the App private key. The default project does
# not start the fakes. The mounted binaries are linux ELFs built for the
# Docker architecture and are not committed. Profile tunnel runs
# cloudflared at host.docker.internal:8080. A quick-tunnel URL changes on
# every start. spike/m4 does not start that profile; Peter runs cloudflared
# on the host, or opts in.
#
# Images are built locally (factoryd:dev, factory-upstream-worker:dev).
# MinIO is Bitnami Legacy: default entrypoint, no `server /data` override.
# MINIO_ROOT_USER must be at least 3 characters.

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-factoryd-image: &factoryd-image
  image: factoryd:dev
  build:
    context: ..
    dockerfile: deploy/factoryd/Dockerfile

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: factory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-factory}
      POSTGRES_DB: factory
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory -d factory"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5@sha256:6dabb4a2088c9a79908de3bc05f4586c23ad2182c8908e7e3acbf61c1467fb20
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-factoryadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-factorysecret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/bitnami/minio/data
    # Bitnami's entrypoint answers /minio/health/live and /ready from a
    # temporary setup process (pid 1 is still entrypoint.sh), then stops
    # that process and execs the real server. A live-only check can report
    # healthy across that restart, and minio-init exits on connection refused.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS http://127.0.0.1:9000/minio/health/ready >/dev/null
          && test "$$(cat /proc/1/comm)" = minio
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    logging: *logging

  # Creates the bucket, then stays up. An exited init container fails
  # `up --wait`. The entrypoint is the image default. mc is retried
  # because a single alias set races the setup-server restart.
  minio-init:
    image: bitnamilegacy/minio-client:2025.7.21-debian-12-r3@sha256:73bd39f7899a0cef12b8dd5df13aa93a3ed1aaa44236542442e9ac76819ac158
    depends_on:
      minio: { condition: service_healthy }
    environment:
      HOME: /tmp
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-factoryadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-factorysecret}
    command:
      - /bin/bash
      - -ec
      - |
        mkdir -p /tmp/mc
        ok=0
        for _ in $$(seq 1 30); do
          if mc --config-dir /tmp/mc alias set local http://minio:9000 \
            "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" \
            && mc --config-dir /tmp/mc mb --ignore-existing local/factory \
            && mc --config-dir /tmp/mc anonymous set none local/factory; then
            ok=1
            break
          fi
          sleep 2
        done
        if [[ "$$ok" -ne 1 ]]; then
          echo "minio did not accept bucket setup" >&2
          exit 1
        fi
        touch /tmp/bucket-ready
        sleep infinity
    healthcheck:
      test: ["CMD", "bash", "-c", "test -f /tmp/bucket-ready"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: "no"
    logging: *logging

  migrate:
    <<: *factoryd-image
    profiles: ["migrate"]
    depends_on:
      postgres: { condition: service_healthy }
    command: ["migrate", "up"]
    environment:
      FACTORY_DATABASE_URL: postgres://factory:${POSTGRES_PASSWORD:-factory}@postgres:5432/factory?sslmode=disable
    restart: "no"

  factoryd:
    <<: *factoryd-image
    restart: unless-stopped
    depends_on:
      postgres:   { condition: service_healthy }
      minio-init: { condition: service_healthy }
    ports:
      - "8080:8080"
    environment:
      FACTORY_HTTP_ADDR: ${FACTORY_HTTP_ADDR:-:8080}
      FACTORY_EXTERNAL_URL: ${FACTORY_EXTERNAL_URL:-http://localhost:8080}
      FACTORY_TASK_SERVER_URL: ${FACTORY_TASK_SERVER_URL:-http://172.17.0.1:8080}
      FACTORY_DATABASE_URL: postgres://factory:${POSTGRES_PASSWORD:-factory}@postgres:5432/factory?sslmode=disable
      FACTORY_API_KEY: ${FACTORY_API_KEY:-m2-dev-api-key}
      FACTORY_WORKER_API_KEY: ${FACTORY_WORKER_API_KEY:-m2-dev-worker-key}

      FACTORY_S3_ENDPOINT: http://minio:9000
      FACTORY_S3_BUCKET: factory
      FACTORY_S3_ACCESS_KEY: ${S3_ACCESS_KEY:-factoryadmin}
      FACTORY_S3_SECRET_KEY: ${S3_SECRET_KEY:-factorysecret}
      FACTORY_S3_REGION: ${FACTORY_S3_REGION:-us-east-1}
      FACTORY_S3_FORCE_PATH_STYLE: "true"

      FACTORY_DEFINITION_PATH: ${FACTORY_DEFINITION_PATH:-/definitions/m2-factory}

      FACTORY_INFERENCE_OPENAI_COMPATIBLE_BASE_URL: ${FACTORY_INFERENCE_OPENAI_COMPATIBLE_BASE_URL:-}
      FACTORY_INFERENCE_OPENAI_API_KEY: ${FACTORY_INFERENCE_OPENAI_API_KEY:-}
      FACTORY_SECRET_GH_TOKEN: ${FACTORY_SECRET_GH_TOKEN:-}

      FACTORY_WORKER_POOL: ${FACTORY_WORKER_POOL:-standard}
      FACTORY_WORKER_PLATFORM: ${FACTORY_WORKER_PLATFORM:-linux}
      FACTORY_WORKER_MAX_CONCURRENT: ${FACTORY_WORKER_MAX_CONCURRENT:-1}

      FACTORY_LOG_LEVEL: ${FACTORY_LOG_LEVEL:-info}

      # Parked. factoryd does not read these; the pieces are not in M2.
      # FACTORY_SECRETS_PROVIDER: postgres-encrypted
      # FACTORY_SECRETS_MASTER_KEY:
      # FACTORY_INFERENCE_ANTHROPIC_API_KEY:
      # FACTORY_GITHUB_APP_ID:
      # FACTORY_GITHUB_APP_PRIVATE_KEY:
      # FACTORY_GITHUB_WEBHOOK_SECRET:
      # FACTORY_AUTH_MODE: dev-single-user
      # FACTORY_DEV_USER_EMAIL: dev@localhost
    volumes:
      - ${FACTORY_DEFINITION_HOST_PATH:-./m2-factory}:${FACTORY_DEFINITION_MOUNT:-/definitions/m2-factory}:ro
    healthcheck:
      test: ["CMD", "/factoryd", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    logging: *logging

  # Unmodified upstream worker (63dbb8a), Docker backend. There is no
  # --pool flag; factoryd's FACTORY_WORKER_POOL is the scheduler pool.
  # WARP_API_KEY is the worker bearer (FACTORY_WORKER_API_KEY).
  worker:
    image: factory-upstream-worker:dev
    build:
      context: ./worker
    restart: unless-stopped
    depends_on:
      factoryd: { condition: service_healthy }
    command:
      - --worker-id=local-1
      - --backend=docker
      - --config-file=/etc/factory/worker.yaml
      - --max-concurrent-tasks=1
      - --web-socket-url=ws://factoryd:8080/api/v1/selfhosted/worker/ws
      - --server-root-url=http://factoryd:8080
      - --idle-on-complete=0s
      - --log-level=info
    environment:
      WARP_API_KEY: ${FACTORY_WORKER_API_KEY:-m2-dev-worker-key}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../spike/m2/worker.yaml:/etc/factory/worker.yaml:ro
    stop_grace_period: 30s
    logging: *logging

  dex:
    profiles: ["oidc"]
    image: dexidp/dex:latest
    restart: unless-stopped
    ports:
      - "5556:5556"
    volumes:
      - ./dex/config.yaml:/etc/dex/config.yaml:ro
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    logging: *logging

  otel-collector:
    profiles: ["otel"]
    image: otel/opentelemetry-collector-contrib:latest
    restart: unless-stopped
    volumes:
      - ./otel/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4318:4318"
    logging: *logging

  # Offline GitHub App. spike/m4 builds the binary and publishes it on the
  # host so task containers can record commits. factoryd uses the compose
  # DNS name via FACTORY_GITHUB_API_BASE.
  fake-github:
    profiles: ["m4"]
    image: gcr.io/distroless/static-debian12:nonroot@sha256:afa5c872c891853ca7fcf1f12c3edb23f7eeef36189728842dd51042ff57f7ab
    entrypoint: ["/fake-github"]
    command: ["-addr", ":8080"]
    ports:
      - "${M4_FAKE_GITHUB_PORT:-18080}:8080"
    volumes:
      - ${M4_FAKE_GITHUB_BIN:-../spike/m4/.work/fake-github}:/fake-github:ro
    restart: "no"
    logging: *logging

  # Offline Slack Web API. The token file is the bot token factoryd sends.
  # The process does not log it.
  fake-slack:
    profiles: ["m4"]
    image: gcr.io/distroless/static-debian12:nonroot@sha256:afa5c872c891853ca7fcf1f12c3edb23f7eeef36189728842dd51042ff57f7ab
    entrypoint: ["/fake-slack"]
    command: ["-addr", ":8080", "-token-file", "/run/secrets/slack-bot-token"]
    ports:
      - "${M4_FAKE_SLACK_PORT:-18081}:8080"
    volumes:
      - ${M4_FAKE_SLACK_BIN:-../spike/m4/.work/fake-slack}:/fake-slack:ro
      - ${M4_SLACK_TOKEN_FILE:-../spike/m4/.work/slack-bot-token}:/run/secrets/slack-bot-token:ro
    restart: "no"
    logging: *logging

  # Creates factory_git, then stays up. An exited init container fails
  # `up --wait`. factoryd-git migrates this database on boot.
  factory-git-db:
    profiles: ["m5"]
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-factory}
    command:
      - /bin/sh
      - -c
      - >-
        until pg_isready -h postgres -U factory -d factory; do sleep 1; done;
        psql -h postgres -U factory -d factory -v ON_ERROR_STOP=1 -tc
        "SELECT 1 FROM pg_database WHERE datname='factory_git'" | grep -q 1
        || psql -h postgres -U factory -d factory -v ON_ERROR_STOP=1 -c
        "CREATE DATABASE factory_git";
        touch /tmp/factory-git-ready;
        sleep infinity
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -f /tmp/factory-git-ready && pg_isready -h postgres -U factory -d factory_git",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s
    logging: *logging

  # Second factoryd with git, read-only definition. No worker attaches.
  factoryd-git:
    profiles: ["m5"]
    image: factoryd-git:dev
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      minio-init: { condition: service_healthy }
      factory-git-db: { condition: service_healthy }
    ports:
      - "8081:8080"
    environment:
      FACTORY_HTTP_ADDR: ":8080"
      FACTORY_EXTERNAL_URL: http://localhost:8081
      FACTORY_DATABASE_URL: postgres://factory:${POSTGRES_PASSWORD:-factory}@postgres:5432/factory_git?sslmode=disable
      FACTORY_API_KEY: ${FACTORY_API_KEY:-m5-dev-api-key}
      FACTORY_WORKER_API_KEY: ${FACTORY_WORKER_API_KEY:-m5-dev-worker-key}
      FACTORY_S3_ENDPOINT: http://minio:9000
      FACTORY_S3_BUCKET: factory
      FACTORY_S3_ACCESS_KEY: ${S3_ACCESS_KEY:-factoryadmin}
      FACTORY_S3_SECRET_KEY: ${S3_SECRET_KEY:-factorysecret}
      FACTORY_S3_REGION: ${FACTORY_S3_REGION:-us-east-1}
      FACTORY_S3_FORCE_PATH_STYLE: "true"
      FACTORY_DEFINITION_PATH: /var/lib/factory/definition
      FACTORY_DEFINITION_GIT_URL: file:///git/factory.git
      FACTORY_DEFINITION_GIT_REF: main
      FACTORY_DEFINITION_GIT_PRODUCTION_REF: main
      FACTORY_DEFINITION_GIT_INTERVAL: 30s
      FACTORY_CONSOLE: "on"
      FACTORY_LOG_LEVEL: info
      GIT_CONFIG_COUNT: "2"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
      GIT_CONFIG_KEY_1: protocol.file.allow
      GIT_CONFIG_VALUE_1: always
      GIT_TERMINAL_PROMPT: "0"
    volumes:
      - ${M5_GIT_HOST:-/tmp/m5-git}:/git:ro
      # Parent of the definition directory, so defsync can rename it.
      - factory-git-definition:/var/lib/factory
    healthcheck:
      test: ["CMD", "/factoryd", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    logging: *logging

  # Optional public ingress. Not part of MODE=offline. The URL is not stable.
  tunnel:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      - --url
      - http://host.docker.internal:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging: *logging

volumes:
  pgdata:
  miniodata:
  factory-git-definition:
