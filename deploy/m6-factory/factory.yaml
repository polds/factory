# M6 exit factory. Offline rewrites factory-default and factory-judge
# on a copy. Those offline ids are not in this tree.
schemaVersion: v1alpha1
name: m6
description: Self-improvement loop for a missing citation convention.
secrets:
  - DEFINITION_GIT_URL
  - GITHUB_API_BASE
  - M6_PLANTED
agentDefaults:
  model: factory-default
  runner: local
  pool: standard
scorerDefaults:
  runner: local
  model: factory-judge
selfImprovement:
  failedRunThreshold: 3
  reviewerType: admins
pipeline:
  stages: [building]
  agents:
    building: implementer
  revisionLimit: 1
