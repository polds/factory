# Definition files and the compose sketch use aligned flow style
# (`key:    { a: 1,  b: 2 }`). Keep the rules that catch real mistakes
# and allow that alignment.
extends: default

ignore: |
  .git/
  **/.work/

rules:
  document-start: disable
  line-length:
    max: 120
    allow-non-breakable-words: true
    allow-non-breakable-inline-mappings: true
  braces:
    min-spaces-inside: 0
    max-spaces-inside: 1
  brackets:
    min-spaces-inside: 0
    max-spaces-inside: 1
  commas:
    max-spaces-after: -1
  colons:
    max-spaces-before: 0
    max-spaces-after: -1
  comments:
    min-spaces-from-content: 1
  comments-indentation: disable
  truthy:
    check-keys: false
